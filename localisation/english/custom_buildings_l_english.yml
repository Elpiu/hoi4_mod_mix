 # ============================================================================
 # CAMICIE BIANCHE
 # ============================================================================
 camicie_bianche:0 "Camicie Bianche"
 camicie_bianche_desc:0 "Paramilitary militia organized for defensive warfare and internal order enforcement. Numerous but lightly armed, they excel at holding fortified positions and suppressing civil unrest. No territorial restrictions — they can be deployed anywhere without penalty."

 # ============================================================================
 # CAMICIE ROSSE
 # ============================================================================
 camicie_rosse:0 "Camicie Rosse"
 camicie_rosse_desc:0 "Elite assault infantry, extensively trained for offensive operations. More numerous and far better equipped than standard infantry, they represent the pinnacle of ground combat capability. Their formation requires significantly more time and resources than regular troops."
