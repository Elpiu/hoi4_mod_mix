 modifier_state_production_heavy_machinery_factory_factor:0 "Velocità costruzione §YFabbrica Macchinari Pesanti§!"
 modifier_state_production_heavy_machinery_factory_factor_desc:0 "Modifica la velocità di costruzione della §YFabbrica Macchinari Pesanti§! in questo stato."

