 # ============================================================================
 # CENTRO DI ACCOGLIENZA
 # ============================================================================
 refugee_center:0 "Centro di Accoglienza"
 refugee_center_desc:0 "Una struttura che fornisce rifugio e servizi di integrazione per le popolazioni sfollate. Aumenta la manodopera locale e la crescita della popolazione, ma richiede l'utilizzo di capacità produttiva civile per il mantenimento."
 refugee_center_plural:0 "Centri di Accoglienza"

 modifier_production_speed_refugee_center_factor:0 "Velocità costruzione §YCentro di Accoglienza§!"
