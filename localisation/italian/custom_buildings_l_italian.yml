 # MINISTERO DELLA PROPAGANDA
 # ============================================================================
 propaganda_ministry:0 "Ministero della Propaganda"
 propaganda_ministry_desc:0 "Un apparato statale dedicato a plasmare l'opinione pubblica e controllare il flusso di informazioni. Aumenta la generazione di potere politico e la stabilità nazionale, ma deteriora le relazioni commerciali con l'estero e sopprime la resistenza locale attraverso paura e conformismo."
 propaganda_ministry_plural:0 "Ministeri della Propaganda"

