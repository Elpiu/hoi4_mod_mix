 # ============================================================================
 # COMPLESSO NAVALE-AERONAUTICO
 # (Merge di: Fabbrica Pezzi Navali + Fabbrica Componenti Aeronautici + Centro Tecnologie Navali)
 # ============================================================================
 naval_aerospace_complex:0 "Complesso Navale-Aeronautico"
 naval_aerospace_complex_desc:0 "Un enorme hub industriale e tecnologico integrato che combina la produzione di componenti navali, la manifattura di parti aeronautiche e la ricerca avanzata sulle tecnologie navali. Potenzia drasticamente la produzione navale, l'output dei cantieri, le prestazioni degli aerei e le capacità operative della flotta."
 naval_aerospace_complex_plural:0 "Complessi Navali-Aeronautici"

 modifier_production_speed_naval_aerospace_complex_factor:0 "Velocità costruzione §YComplesso Navale-Aeronautico§!"
