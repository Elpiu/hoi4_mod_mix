 # ============================================================================
 research_center:0 "Centro di Ricerca"
 research_center_desc:0 "Una struttura scientifica all'avanguardia con ricercatori di alto livello e laboratori di ultima generazione. Accelera lo sviluppo tecnologico in tutti i campi."
 research_center_plural:0 "Centri di Ricerca"

 modifier_production_speed_research_center_factor:0 "Velocità costruzione §YCentro di Ricerca§!"
