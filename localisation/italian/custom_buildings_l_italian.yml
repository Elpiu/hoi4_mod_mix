 # ============================================================================
 forced_labor_camp:0 "Campo di Lavori Forzati"
 forced_labor_camp_desc:0 "Una struttura brutale che sfrutta il lavoro dei prigionieri per la produzione industriale. Fornisce un notevole output economico a costo della manodopera disponibile e di un aumento della resistenza locale."
