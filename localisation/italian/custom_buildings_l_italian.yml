 # FABBRICA DI MACCHINARI PESANTI
 # ============================================================================
 heavy_machinery_factory:0 "Fabbrica Macchinari Pesanti"
 heavy_machinery_factory_desc:0 "Un complesso industriale dedicato alla produzione di macchinari da costruzione e attrezzature pesanti. Aumenta significativamente la velocità di costruzione e lo sviluppo infrastrutturale."
 heavy_machinery_factory_plural:0 "Fabbriche Macchinari Pesanti"

 modifier_production_speed_heavy_machinery_factory_factor:0 "Velocità costruzione §YFabbrica Macchinari Pesanti§!"
